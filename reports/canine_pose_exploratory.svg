<text x="60" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#163247">PetLens canine-pose experiment</text>
<text x="60" y="82" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#526b7c">AP-10K dog-only ResNet-18 heatmap · random initialization · exploratory localization</text>
